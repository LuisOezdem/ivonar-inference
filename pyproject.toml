[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ivonar-inference"
version = "0.2.0"
description = "Local inference server and CLI for Ivonar ternary language models."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = [
    "torch>=2.7,<3",
    "tokenizers>=0.20,<1",
    "fastapi>=0.110,<1",
    "uvicorn>=0.29,<1",
    "pydantic>=2.6,<3",
]

[project.optional-dependencies]
test = [
    "pytest>=8,<10",
    "httpx>=0.27,<1",
]

[project.scripts]
ivonar = "ivonar_inference.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ivonar_inference = ["web/*.html", "web/assets/*", "kernels/*.cu"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q -p no:cacheprovider"
